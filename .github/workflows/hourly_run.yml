name: Hourly Crypto Update
on:
  schedule:
    - cron: '0 * * * *'  
  workflow_dispatch:     

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pandas requests sqlalchemy psycopg2-binary

      - name: Execute Script
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: python crypto.py
